<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="640" viewBox="0 0 1536 640" role="img" aria-labelledby="title desc">
  <title id="title">FileMint logo</title>
  <desc id="desc">Vector logo with a green cloud, document and leaf symbol, and FileMint wordmark.</desc>
  <defs>
    <linearGradient id="cloud" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1ce58a"/><stop offset=".55" stop-color="#30df83"/><stop offset="1" stop-color="#009c59"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ce95f"/><stop offset=".55" stop-color="#00a84f"/><stop offset="1" stop-color="#006b49"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#1bdc58"/><stop offset=".6" stop-color="#00a653"/><stop offset="1" stop-color="#00845b"/>
    </linearGradient>
  </defs>
  <rect width="1536" height="640" fill="#fff"/>
  <!-- Cloud silhouette -->
  <path fill="url(#cloud)" d="M91 444C47 444 20 411 20 369c0-40 28-72 67-77 13-55 58-91 113-91 58 0 103 37 117 88 43 2 75 32 75 72 0 19-7 37-20 50l-42 34H91Z"/>
  <path fill="#6bf2ac" opacity=".6" d="M45 369c0-31 20-56 49-63 14-3 29 0 41 8-13 19-20 41-20 66v62c-40-2-70-31-70-73Z"/>
  <!-- Document: all contours are vector paths -->
  <path fill="#fff" stroke="#07543e" stroke-width="16" stroke-linejoin="round" d="M132 180h171l59 59v258H132c-17 0-29-13-29-30V210c0-17 12-30 29-30Z"/>
  <path fill="none" stroke="#07543e" stroke-width="16" stroke-linejoin="round" d="M303 180v39c0 14 10 23 24 23h35"/>
  <path fill="none" stroke="#07543e" stroke-width="20" stroke-linecap="round" d="M157 291h92M157 345h112M157 399h78"/>
  <!-- Leaf and central vein -->
  <path fill="url(#leaf)" d="M265 545c8-91 55-166 144-207 38-18 77-29 113-32-13 91-62 166-143 209-39 20-78 31-114 30Z"/>
  <path fill="none" stroke="#eafff1" stroke-width="6" stroke-linecap="round" d="M271 542c49-79 108-141 193-204"/>
  <!-- Wordmark. Text stays editable; replace with outlines in a vector editor if required. -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="164" font-weight="800" letter-spacing="-6">
    <text x="515" y="389" fill="#171d25">File</text>
    <text x="830" y="389" fill="url(#mint)">Mint</text>
  </g>
</svg>